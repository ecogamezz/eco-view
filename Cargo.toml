[package]
name = "eco-view"
version = "0.1.0"
edition = "2024"
description = "A customizable macOS system monitor"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "ico", "jpeg", "png"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No "multithread": its rayon pool cost far more than refreshing
# processes on the metrics thread itself.
sysinfo = { version = "0.33.1", default-features = false, features = ["component", "disk", "network", "system", "user"] }

# AppKit access for the raccoon's overlay window (Spaces, shadow, level) and the
# Dock-aware visible frame of each display. Same versions winit already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSEnumerator", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSScreen", "NSWindow", "NSWorkspace", "libc"] }

[profile.release]
# The dashboard, particles, and raccoon all animate every frame, so favour
# frame rate over binary size on this Intel Mac.
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
