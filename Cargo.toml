[package]
name = "eco-view"
version = "0.1.0"
edition = "2024"
description = "An elegant, customizable Windows system monitor"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "ico", "jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls_Dialogs"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
